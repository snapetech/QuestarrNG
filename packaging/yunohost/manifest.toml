#:schema https://raw.githubusercontent.com/YunoHost/apps/main/schemas/manifest.v2.schema.json

packaging_format = 2

id = "questarrng"
name = "QuestarrNG"
description.en = "Discover, track, and manage a video game collection"
version = "1.9.2~ynh1"
maintainers = ["snapetech"]

[upstream]
license = "GPL-3.0-only"
code = "https://github.com/snapetech/QuestarrNG"

[integration]
yunohost = ">= 12.1.17"
helpers_version = "2.1"
architectures = ["amd64", "arm64"]
multi_instance = true
ldap = false
sso = false
disk = "2G"
ram.build = "2G"
ram.runtime = "1G"

[install]
  [install.domain]
  type = "domain"

  [install.path]
  type = "path"
  default = "/"
  pattern = { regexp = "^/$", error = "QuestarrNG must be installed at the root of a dedicated domain; URL subpaths are not supported." }

  [install.init_main_permission]
  type = "group"
  default = "admins"

[resources]
  [resources.sources]
    [resources.sources.main]
    in_subdir = true
    format = "tar.gz"
    url = "https://github.com/snapetech/QuestarrNG/archive/refs/tags/v1.9.2.tar.gz"
    sha256 = "0d6ac0d1cef8326689cca1c73f1cd4fa496da79e65583a4074b17b336e6034f3"
    autoupdate.strategy = "latest_github_tag"

  [resources.system_user]

  [resources.install_dir]

  [resources.data_dir]

  [resources.permissions]
  main.url = "/"
  main.auth_header = false
  main.show_tile = true

  [resources.ports]
  main.default = 5963

  [resources.nodejs]
  version = "24"

  [resources.apt]
    packages = "p7zip-full, python3-venv, rsync"
