location / {
	proxy_pass http://127.0.0.1:__PORT__;
	proxy_http_version 1.1;
	set $questarr_upgrade "";
	set $questarr_connection "";
	if ($http_upgrade ~* "^websocket$") {
		set $questarr_upgrade websocket;
		set $questarr_connection upgrade;
	}
	proxy_set_header Host 127.0.0.1;
	proxy_set_header X-Real-IP $remote_addr;
	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	proxy_set_header X-Forwarded-Proto $scheme;
	# The location guard above allows only websocket; all other upgrades are cleared.
	# nosemgrep: generic.nginx.security.possible-h2c-smuggling.possible-nginx-h2c-smuggling
	proxy_set_header Upgrade $questarr_upgrade;
	proxy_set_header Connection $questarr_connection;
	proxy_cache_bypass $questarr_upgrade;
	proxy_buffering off;
	proxy_read_timeout 3600s;
	proxy_send_timeout 3600s;
}
