name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Allow manual trigger
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-notes:
    name: Release-note contract
    if: github.event_name == 'pull_request' && github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.x
          package-manager-cache: false

      - name: Validate release-note fragment or explicit opt-out
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BODY: ${{ github.event.pull_request.body || '' }}
        run: |
          set -euo pipefail
          body_file="$RUNNER_TEMP/pr-body.md"
          printf '%s' "$PR_BODY" > "$body_file"
          node scripts/check-release-notes.mjs \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --pr-body "$body_file" \
            --summary-file "$GITHUB_STEP_SUMMARY"

  secrets-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.2.0
        with:
          persist-credentials: false

      # secretlint requires Node >=22
      - name: Setup Node.js 26.x
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.x
          # GitHub scopes the Actions cache per-branch (a pull_request run cannot write
          # into the cache that push/main runs restore from), and every `npm ci` in this
          # workflow runs with --ignore-scripts, so a compromised dependency cannot run
          # install/postinstall code to tamper with the cache before it's saved. This repo
          # has a single maintainer with push access, so cache-poisoning here is accepted
          # as a low, non-actionable risk instead of splitting cache restore/save by trust.
          cache: "npm" # zizmor: ignore[cache-poisoning]

      # secretlint only lints files; it needs no native modules built, so lifecycle
      # scripts (arbitrary code from transitive deps) are skipped here.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Scan for secrets
        run: npm run secretlint

  check-overrides:
    runs-on: ubuntu-latest

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.2.0
        with:
          persist-credentials: false

      - name: Setup Node.js 26.x
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.x
          cache: "npm" # zizmor: ignore[cache-poisoning]

      # check-overrides only reads package.json manifests already unpacked into
      # node_modules; no native modules need building, so scripts are skipped.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Fails if a package.json "overrides" entry (see docs/DEPENDENCIES.md) has become
      # redundant, i.e. every consumer now declares a range that's already safe on its own.
      - name: Check for stale dependency overrides
        run: npm run check:overrides

  sca-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.2.0
        with:
          persist-credentials: false

      - name: Setup Node.js 26.x
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.x
          cache: "npm" # zizmor: ignore[cache-poisoning]

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Policy: docs/VULNERABILITY_MANAGEMENT.md §1.3 — Critical/High findings
      # in any direct or transitive dependency block merge/release.
      - name: Audit all dependencies (Critical/High blocks build)
        run: npm audit --audit-level=high

      # Policy: docs/VULNERABILITY_MANAGEMENT.md §1.4 — production dependency
      # licenses must be on the allow-list.
      - name: Check dependency licenses
        run: npm run check:licenses

  windows-service:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.2.0
        with:
          persist-credentials: false

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore locked Windows service dependencies
        run: dotnet restore installer/windows/Questarr.Service/Questarr.Service.csproj --runtime win-x64 --locked-mode

      - name: Publish self-contained Windows service host
        run: >-
          dotnet publish installer/windows/Questarr.Service/Questarr.Service.csproj
          --configuration Release
          --no-restore
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:PublishTrimmed=false
          --output ./artifacts/windows-service

      - name: Verify published service executable
        run: test -s ./artifacts/windows-service/Questarr.Service.exe

  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.2.0
        with:
          persist-credentials: false

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.x
          cache: "npm" # zizmor: ignore[cache-poisoning]

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Each shard records its own coverage blob; per-shard coverage only reflects
      # the fraction of the suite that shard ran, so thresholds are disabled here
      # and enforced once against the merged report in merge-test-reports below.
      - name: Tests (shard ${{ matrix.shard }}/4)
        run: |
          npm test -- --shard=${{ matrix.shard }}/4 --coverage \
            --coverage.thresholds.statements=0 \
            --coverage.thresholds.branches=0 \
            --coverage.thresholds.functions=0 \
            --coverage.thresholds.lines=0 \
            --reporter=blob --reporter=verbose

      - name: Upload blob report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: blob-report-${{ matrix.shard }}
          path: .vitest/blob/*
          include-hidden-files: true
          retention-days: 1

  merge-test-reports:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.2.0
        with:
          persist-credentials: false

      - name: Setup Node.js 26.x
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.x
          cache: "npm" # zizmor: ignore[cache-poisoning]

      # This job only merges previously-collected blob reports; it never executes
      # application code, so native module build scripts (e.g. better-sqlite3) aren't needed.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Download blob reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: .vitest/blob
          pattern: blob-report-*
          merge-multiple: true

      - name: Merge shard reports and check coverage thresholds
        run: npx --no-install vitest run --merge-reports --coverage --reporter=junit --outputFile=test-report.junit.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          report_type: coverage
          skip_validation: true

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
          skip_validation: true

  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: ["22.19.0", "26.x"]

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.2.0
        with:
          persist-credentials: false

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm" # zizmor: ignore[cache-poisoning]

      # Lint/type-check/bundle never execute application code, so native module
      # build scripts (e.g. better-sqlite3) aren't needed here.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: TypeScript type check
        run: npm run check

      - name: Build project
        run: npm run build

      - name: Check for build artifacts
        run: |
          if [ ! -d "dist" ]; then
            echo "Error: dist directory not found after build"
            exit 1
          fi
          echo "Build successful - dist directory created"

  docker-build:
    runs-on: ubuntu-latest
    needs: [build, merge-test-reports]

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
          allowed-endpoints: >
            pypi.org:443
            files.pythonhosted.org:443
            www.rarlab.com:443

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.2.0
        with:
          persist-credentials: false

      - name: Pre-pull BuildKit image
        run: |
          for i in {1..5}; do
            docker pull moby/buildkit:buildx-stable-1 && break
            echo "Pull failed, retrying in 5 seconds..."
            sleep 5
          done

      - name: Set up Docker Buildx
        uses: step-security/setup-buildx-action@a4709e2865773e1792246433e8eb922f9743a875 # v4.2.0
      - name: Build Docker image
        uses: step-security/docker-build-push-action@144392094f7fc3199dda455efe3b70dbea4b72a0 # v7.3.0
        with:
          context: .
          push: false
          tags: questarr:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true

      - name: Verify Docker image
        run: |
          echo "Docker image built successfully"
          docker images | grep questarr || echo "Image not found in docker images, but build completed"
