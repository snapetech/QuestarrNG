name: Publish QuestarrNG image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      announce_release_tag:
        description: Announce an already-published release without rebuilding the image
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: fork-image-${{ inputs.announce_release_tag || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' || inputs.announce_release_tag == '' }}

jobs:
  publish:
    if: github.repository == 'snapetech/QuestarrNG' && (github.event_name != 'workflow_dispatch' || (github.ref == 'refs/heads/main' && inputs.announce_release_tag == ''))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if [[ "$TAG" != "v$version" ]]; then
            echo "Tag $TAG does not match package version $version."
            exit 1
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must use vMAJOR.MINOR.PATCH."
            exit 1
          fi
          git fetch origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "Release tag $TAG is not on main."
            exit 1
          }

      - name: Set image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set image tags
        id: tags
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          set -euo pipefail
          {
            echo 'tags<<EOF'
            echo "$IMAGE:sha-${GITHUB_SHA}"
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              echo "$IMAGE:${GITHUB_REF_NAME#v}"
            else
              echo "$IMAGE:latest"
            fi
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU for ARM64 release images
        uses: step-security/setup-qemu-action@1d653f731ddc90c553742100d15205c94b792314 # v4.2.0

      - name: Set up Docker Buildx
        uses: step-security/setup-buildx-action@a4709e2865773e1792246433e8eb922f9743a875 # v4.2.0

      - name: Log in to GHCR
        uses: step-security/docker-login-action@8c7b695d8738c5699a679ff5254baf0f19f20a94 # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish fork image
        uses: step-security/docker-build-push-action@144392094f7fc3199dda455efe3b70dbea4b72a0 # v7.3.0
        with:
          context: .
          target: production
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test published image and SeerrNG route
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
        run: |
          set -euo pipefail
          docker volume create questarrng-smoke-data
          docker volume create questarrng-rootless-smoke-data
          trap 'docker stop questarrng-smoke questarrng-rootless-smoke >/dev/null 2>&1 || true; docker volume rm questarrng-smoke-data questarrng-rootless-smoke-data >/dev/null 2>&1 || true' EXIT
          docker run -d --name questarrng-smoke \
            -p 127.0.0.1:15000:5000 \
            -v questarrng-smoke-data:/app/data \
            "$IMAGE"
          for attempt in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:15000/api/health >/dev/null; then
              break
            fi
            if ! docker inspect questarrng-smoke --format '{{.State.Running}}' | grep -qx true; then
              docker logs questarrng-smoke
              exit 1
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:15000/api/health >/dev/null
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:15000/api/integration/seerrng/v1/ping)" = 401
          docker run --rm --user 0:0 \
            -v questarrng-rootless-smoke-data:/app/data \
            --entrypoint sh \
            "$IMAGE" \
            -c 'chown -R 1000:1000 /app/data && touch /app/data/.rootless-smoke'
          docker run -d --name questarrng-rootless-smoke \
            --user 1000:1000 \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            -e HOME=/tmp \
            -e QUESTARR_LOG_FILE=/app/data/server.log \
            -p 127.0.0.1:15001:5000 \
            -v questarrng-rootless-smoke-data:/app/data \
            "$IMAGE"
          for attempt in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:15001/api/health >/dev/null; then
              break
            fi
            if ! docker inspect questarrng-rootless-smoke --format '{{.State.Running}}' | grep -qx true; then
              docker logs questarrng-rootless-smoke
              exit 1
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:15001/api/health >/dev/null
          test "$(docker exec questarrng-rootless-smoke id -u)" = "1000"

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js 22.x
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x

      - name: Add curated release-note fragments
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          previous_tag="$(scripts/latest-published-release-tag.sh "$TAG")"
          node scripts/assemble-release-notes.mjs \
            --previous-tag "$previous_tag" \
            --head "$GITHUB_SHA" \
            --version "$VERSION" \
            --changelog docs/CHANGELOG.md \
            --output docs/CHANGELOG.md
          node scripts/extract-changelog.mjs "$VERSION" > changelog-section.md
          if ! grep -Eq '^[[:space:]]*-[[:space:]]+' changelog-section.md; then
            echo 'Generated release notes contain no changelog entries.' >&2
            exit 1
          fi

      - name: Add image pull instructions
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          IMAGE: ${{ needs.publish.outputs.image }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          {
            echo ""
            echo "**Container image**: \`${IMAGE}:${VERSION}\`"
            echo "- [GitHub Container Registry](https://github.com/${{ github.repository }}/pkgs/container/questarrng)"
            echo ""
            echo "Pull with: \`docker pull ${IMAGE}:${VERSION}\`."
          } >> changelog-section.md

      - name: Publish GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          name: QuestarrNG ${{ github.ref_name }}
          body_path: changelog-section.md
          draft: false

  update-changelog:
    name: Commit generated changelog
    needs: [release]
    if: startsWith(github.ref, 'refs/tags/v') && needs.release.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Checkout release history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.x
          package-manager-cache: false

      - name: Update the release section on main
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          previous_tag="$(scripts/latest-published-release-tag.sh "$TAG")"
          release_sha="$(git rev-parse "${TAG}^{commit}")"
          git fetch origin main:refs/remotes/origin/main
          git checkout -B changelog-update origin/main
          node scripts/assemble-release-notes.mjs \
            --previous-tag "$previous_tag" \
            --head "$release_sha" \
            --version "$VERSION" \
            --changelog docs/CHANGELOG.md \
            --output docs/CHANGELOG.md
          git add docs/CHANGELOG.md
          if git diff --cached --quiet; then
            echo 'The checked-in changelog already contains these release notes.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit \
            -m "docs(changelog): include curated notes for ${TAG}" \
            -m 'release-note: none'
          git push origin HEAD:refs/heads/main

  announce-release:
    name: Announce release to Discord
    needs: [release]
    if: ${{ always() && ((startsWith(github.ref, 'refs/tags/v') && needs.release.result == 'success') || (github.event_name == 'workflow_dispatch' && inputs.announce_release_tag != '')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
      TAG: ${{ inputs.announce_release_tag || github.ref_name }}
    steps:
      - name: Checkout release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.x
          package-manager-cache: false

      - name: Send release announcement
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Release announcement tag must use vMAJOR.MINOR.PATCH.' >&2
            exit 1
          fi
          test -n "$DISCORD_WEBHOOK" || {
            echo 'DISCORD_RELEASE_WEBHOOK is required to announce a release.' >&2
            exit 1
          }

          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json body,isDraft,isPrerelease,tagName,url > release.json
          jq -e --arg tag "$TAG" \
            '.tagName == $tag and .isDraft == false and .isPrerelease == false and (.body | type == "string" and length > 0)' \
            release.json > /dev/null
          version="${TAG#v}"
          printf '%s' "$(jq -r '.body' release.json)" \
            | node scripts/discord-release-notes.mjs --split > chunks.json
          chunk_count="$(jq 'length' chunks.json)"
          (( chunk_count > 0 )) || {
            echo 'The published release notes are empty.' >&2
            exit 1
          }

          webhook_url="$DISCORD_WEBHOOK"
          if [[ "$webhook_url" == *'?'* ]]; then
            webhook_url+='&wait=true'
          else
            webhook_url+='?wait=true'
          fi

          for ((index = 0; index < chunk_count; index += 1)); do
            description="$(jq -r --argjson index "$index" '.[$index]' chunks.json)"
            number=$((index + 1))
            title="QuestarrNG ${TAG} release notes (${number}/${chunk_count})"
            jq -n \
              --arg username 'QuestarrNG Releases' \
              --arg title "$title" \
              --arg url "$(jq -r '.url' release.json)" \
              --arg description "$description" \
              --arg image "ghcr.io/snapetech/questarrng:${version}" \
              --arg run_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
              --argjson first "$index" \
              '{
                username: $username,
                embeds: [{
                  title: $title,
                  url: $url,
                  description: $description,
                  color: 5814783,
                  fields: (if $first == 0 then [
                    { name: "Image", value: $image, inline: false },
                    { name: "Workflow", value: $run_url, inline: false }
                  ] else [] end)
                }]
              }' > payload.json

            response="$(curl --fail --silent --show-error \
              -H 'Content-Type: application/json' \
              -X POST \
              --data @payload.json \
              "$webhook_url")"
            jq -e --arg description "$description" \
              '.id != null and .embeds[0].description == $description' \
              <<< "$response" > /dev/null
            if (( number < chunk_count )); then
              sleep 1
            fi
          done
