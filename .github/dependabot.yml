version: 2
# The default branch is main. Keep target-branch unset so security-update
# groups in this file are applied by Dependabot.
updates:
  # Enable version updates for npm
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "automated"
    versioning-strategy: increase
    ignore:
      # typescript-eslint 8.71.0 and the current parser ecosystem support TypeScript <6.1.
      # Re-enable TypeScript 7 after upstream peer ranges include it.
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"
    groups:
      # Group React related dependencies
      react:
        patterns:
          - "react*"
          - "@types/react*"
      # Group Radix UI components
      radix-ui:
        patterns:
          - "@radix-ui/*"
      # Group development tools
      dev-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
      # Group all other production dependencies
      production:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"

  # Track the .NET SDK pinned for the Windows service build.
  - package-ecosystem: "dotnet-sdk"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "automated"

  # Keep the Windows service host's NuGet packages and lock file current.
  - package-ecosystem: "nuget"
    directory: "/installer/windows/Questarr.Service"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "automated"
    groups:
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"

  # Track the pinned Apprise runtime and its hash-locked transitive packages.
  - package-ecosystem: "pip"
    directory: "/security"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "automated"
    groups:
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"

  # Keep the hash-locked security overrides for the Semgrep scanner up to date.
  - package-ecosystem: "pip"
    directory: "/.github/requirements"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "automated"
    ignore:
      # Semgrep's bundled MCP integration still uses the v1 API. The v2 SDK is
      # a breaking rewrite; revisit once the pinned scanner supports that line.
      - dependency-name: "mcp"
        update-types:
          - "version-update:semver-major"
    groups:
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"

  # Track the pinned Semgrep scanner image used by the SAST job.
  - package-ecosystem: "docker"
    directory: "/.github/semgrep"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "automated"
    groups:
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"

  # Enable version updates for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - "github-actions"
      - "dependencies"
    groups:
      # Group all GitHub Actions updates into a single PR
      all-actions:
        patterns:
          - "*"
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    groups:
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /questarr
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    groups:
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /casaos
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    groups:
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /doezer-questarr
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    groups:
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"
